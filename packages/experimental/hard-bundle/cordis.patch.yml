- insert:
    - id: hard-ledger
      name: '@deepseek-ai/dsh-experimental-hard-ledger'
    - id: hard-verifier
      name: '@deepseek-ai/dsh-experimental-hard-verifier'
    - id: hard-tools
      name: '@deepseek-ai/dsh-experimental-hard-tools'
    - id: hard-mission
      name: '@deepseek-ai/dsh-experimental-hard-mission'
      config:
        objective: ''
        target:
          # Both fields fail the load until a deployment sets real values.
          repoPath: ''
          commit: HEAD
    - id: hard-stopgate
      name: '@deepseek-ai/dsh-experimental-hard-stopgate'
    - id: hard-standby
      name: '@deepseek-ai/dsh-experimental-hard-standby'
    - id: hard-handoff
      name: '@deepseek-ai/dsh-experimental-hard-handoff'
    - id: hard-rounds
      name: '@deepseek-ai/dsh-experimental-hard-rounds'
    - id: hard-deepread
      name: '@deepseek-ai/dsh-experimental-hard-deepread'
    # Mounted off: each audit spends model tokens on a cold context, so a
    # deployment opts in with `enabled: true`.
    - id: hard-audit
      name: '@deepseek-ai/dsh-experimental-hard-audit'
    # The browser coverage panel rides this same bundle: a Web composition
    # (base + web-app) mounts it, a headless one does not. The check reads the
    # launch-time startedBundles, so the panel follows the composition the
    # process booted, not a profile name — any base+web-app profile that
    # switches the bundle on gets the panel.
    - id: ui-hard
      name: '@deepseek-ai/dsh-experimental-client-ui-hard'
      disabled: !!js "!ctx.get('profileContext')?.startedBundles.includes('@deepseek-ai/dsh-web-app')"
